[workspace]
members = ["crates/core", "src-tauri"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true

# Keep the engine fast even in debug builds of the app.
[profile.dev.package.canopy-core]
opt-level = 3
[profile.dev.package.rusqlite]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
